name: GitHub Stats - Repository Showcase

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  repository-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate repositories.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: repositories.svg
          template: classic
          base: ""

          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred

          plugin_lines: yes
          plugin_lines_sections: base

          plugin_stars: yes
          plugin_stars_limit: 6
